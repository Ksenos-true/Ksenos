-- Конфигурация научного эксперимента
-- Пример для предметной области: Научные исследования

var gravity 9.80665
var pi 3.14159265359
var room_temperature 25.0

{
    experiment => {
        title => [[Изучение колебаний математического маятника]],
        researcher => [[Профессор Иванов П.С.]],
        date => [[2024-03-15]],
        lab => [[Лаборатория физики, кафедра 42]],
        
        parameters => {
            pendulum_length => 1.5,      -- Длина маятника в метрах
            bob_mass => 0.2,             -- Масса груза в кг
            initial_angle => 15.0,       -- Начальный угол в градусах
            air_resistance => 0.01       -- Коэффициент сопротивления воздуха
        },
        
        equipment => {
            sensor_precision => 0.001,   -- Точность датчиков
            sample_rate => 1000.0,       -- Частота дискретизации
            measurement_time => 60.0     -- Время измерений в секундах
        },
        
        environment => {
            temperature => ?(room_temperature + 2.5),  -- 25 + 2.5 = 27.5
            pressure => 101.325,          -- Давление в кПа
            humidity => 45.5,             -- Влажность в %
            altitude => 150.0             -- Высота над уровнем моря
        },
        
        calculations => {
            -- Теоретический период колебаний
            theoretical_period => ?(2.0 * pi * (1.5 / gravity)^0.5),
            
            -- Проверка количества измерений на четность
            is_even_samples => ?(mod(1000.0, 2.0) == 0.0),
            
            -- Калибровочная константа
            calibration_offset => 0.001
        },
        
        -- Символы для отчета
        symbols => {
            degree => ?(chr(176.0)),      -- Знак градуса °
            pi_symbol => ?(chr(960.0)),   -- Греческая буква π
            delta => ?(chr(916.0))        -- Греческая буква Δ
        }
    },
    
    safety => {
        max_voltage => 24.0,
        max_current => 0.5,
        emergency_stop => true,
        operator_trained => true
    }
}