-- Конфигурация веб-сервера Nginx
-- Пример для предметной области: IT-инфраструктура

var http_port 80.0
var https_port 443.0
var worker_processes 4.0

{
    server => {
        name => [[Production Nginx]],
        
        network => {
            listen_http => ?(http_port),
            listen_https => ?(https_port),
            server_name => [[example.com www.example.com]],
            client_max_body_size => 10.0
        },
        
        performance => {
            workers => worker_processes,
            keepalive_timeout => 65.0,
            gzip => true,
            gzip_level => 6.0
        },
        
        logging => {
            access_log => [[/var/log/nginx/access.log]],
            error_log => [[/var/log/nginx/error.log]],
            log_format => [[$remote_addr - $remote_user [$time_local] "$request"]]
        },
        
        -- Специальный символ для мониторинга
        status_icon => ?(chr(9881.0))
    }
}