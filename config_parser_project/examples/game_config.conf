-- Конфигурация игрового персонажа
-- Пример для предметной области: Разработка игр

var base_health 100.0
var base_mana 50.0
var player_level 10.0

{
    player => {
        name => [[Aelar the Mage]],
        class => [[Wizard]],
        
        attributes => {
            strength => 8.0,
            dexterity => 12.0,
            intelligence => 18.0,
            health => ?(base_health + player_level * 5.0),
            mana => ?(base_mana + player_level * 3.0)
        },
        
        skills => {
            fireball => {
                damage => ?(25.0 + player_level * 2.0),
                mana_cost => 15.0,
                cooldown => 3.0,
                icon => ?(chr(128293.0))
            },
            
            heal => {
                power => 20.0,
                mana_cost => 25.0,
                cooldown => 5.0,
                icon => ?(chr(9829.0))
            },
            
            teleport => {
                range => 50.0,
                mana_cost => 30.0,
                cooldown => 10.0
            }
        },
        
        inventory => {
            max_items => 20.0,
            max_weight => 100.0,
            gold => 500.0
        }
    },
    
    -- Символы для отображения
    ui_symbols => {
        health_icon => ?(chr(10084.0)),
        mana_icon => ?(chr(9733.0)),
        attack_icon => ?(chr(9876.0))
    }
}